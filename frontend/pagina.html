<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carpintería</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5ede0; color: #2c1a0e; }

        /* Solo se muestra la pantalla con clase "activa" */
        .pantalla { display: none; }
        .pantalla.activa { display: block; }

        .contenedor { display: flex; }

        /* Barra lateral fija */
        nav {
            background: #4a2e1a;
            width: 68px;
            min-height: 100vh;
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 4px;
            flex-shrink: 0;
        }
        .nav-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #7a4a2a;
            width: 100%;
        }
        .nav-logo-circulo { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
        .nav-logo-circulo svg { width: 50px; height: 50px; }
        .nav-logo span { color: #e8d5b8; font-size: 8px; text-align: center; }
        nav button {
            background: none;
            border: none;
            color: #f5ede0;
            font-size: 10px;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 8px;
            width: 58px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        nav button:hover { background: #b5793a; }
        nav button svg { width: 20px; height: 20px; fill: #f5ede0; }

        main { flex: 1; padding: 16px; overflow-y: auto; }

        .banner { border-radius: 12px; height: 150px; margin-bottom: 18px; overflow: hidden; }
        .banner svg { width: 100%; height: 100%; display: block; }

        h2 { font-size: 17px; color: #4a2e1a; margin-bottom: 12px; }

        /* Tarjetas de la pantalla de inicio */
        .tarjeta-categoria {
            background: #7a4a2a;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .tarjeta-categoria:hover { background: #b5793a; }
        .icono-categoria {
            width: 50px; height: 50px;
            background: #b5793a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .icono-categoria svg { width: 28px; height: 28px; }
        .tarjeta-categoria span { color: #f5ede0; font-size: 15px; font-weight: bold; }

        .btn-regresar {
            background: none; border: none; color: #4a2e1a;
            font-size: 14px; font-weight: bold; cursor: pointer;
            margin-bottom: 14px; display: flex; align-items: center; gap: 4px;
        }
        .btn-regresar:hover { color: #b5793a; }
        .btn-regresar svg { width: 16px; height: 16px; }

        .grupo-titulo {
            font-size: 16px; font-weight: bold; color: #4a2e1a;
            border-bottom: 2px solid #e8d5b8;
            padding-bottom: 4px; margin: 18px 0 10px;
        }
        .grupo-titulo:first-child { margin-top: 0; }

        /* Grid de productos */
        .grid-productos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 6px; }
        .tarjeta-producto { background: white; border-radius: 10px; overflow: hidden; border: 1px solid #e8d5b8; cursor: pointer; }
        .tarjeta-producto:hover { border-color: #b5793a; }
        .imagen-producto { width: 100%; height: 100px; display: flex; align-items: center; justify-content: center; }
        .imagen-producto svg { width: 48px; height: 48px; }
        .tarjeta-producto .info { padding: 8px 10px 10px; }
        .tarjeta-producto .nombre { font-size: 13px; font-weight: bold; color: #4a2e1a; }
        .tarjeta-producto .precio { font-size: 13px; color: #b5793a; font-weight: bold; margin-top: 3px; }

        /* Detalle de producto */
        .detalle-header { display: flex; gap: 14px; margin-bottom: 16px; }
        .detalle-imagen { width: 110px; height: 110px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .detalle-imagen svg { width: 60px; height: 60px; }
        .detalle-info h3 { font-size: 18px; color: #4a2e1a; }
        .detalle-info .categoria { font-size: 12px; color: #b5793a; font-style: italic; margin-top: 2px; }
        .detalle-info p { font-size: 13px; color: #5a3a22; margin-top: 8px; line-height: 1.5; }
        .btn-comprar { background: #b5793a; color: white; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-comprar:hover { background: #7a4a2a; }

        /* Reseñas */
        .reseñas-titulo { font-size: 16px; font-weight: bold; color: #4a2e1a; margin: 16px 0 10px; }
        .tarjeta-reseña { background: white; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid #e8d5b8; display: flex; gap: 10px; }
        .tarjeta-reseña .avatar { font-size: 24px; }
        .tarjeta-reseña .usuario { font-size: 13px; font-weight: bold; color: #4a2e1a; }
        .tarjeta-reseña .estrellas { font-size: 13px; }
        .tarjeta-reseña .texto { font-size: 12px; color: #5a3a22; margin-top: 3px; }

        /* Formulario de nueva reseña */
        .form-reseña { background: white; border-radius: 10px; padding: 14px; margin-top: 16px; border: 1px solid #e8d5b8; }
        .form-reseña h4 { font-size: 14px; color: #4a2e1a; margin-bottom: 10px; }
        .form-reseña input, .form-reseña textarea {
            width: 100%; border: 1px solid #e8d5b8; border-radius: 8px;
            padding: 8px 10px; font-size: 13px; font-family: Arial, sans-serif;
            background: #f5ede0; margin-bottom: 8px; outline: none;
        }
        .form-reseña input:focus, .form-reseña textarea:focus { border-color: #b5793a; }
        .form-reseña textarea { resize: none; }
        .selector-estrellas { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; font-size: 13px; color: #4a2e1a; }
        .selector-estrellas .estrella { font-size: 24px; cursor: pointer; color: #ddd; }
        .selector-estrellas .estrella.activa { color: #c8820a; }
        .btn-publicar { background: #4a2e1a; color: white; border: none; border-radius: 8px; padding: 9px 0; font-size: 13px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-publicar:hover { background: #b5793a; }

        /* Notificación emergente */
        .aviso {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #4a2e1a; color: #f5ede0;
            padding: 10px 24px; border-radius: 20px;
            font-size: 13px; font-weight: bold;
            transition: transform 0.3s; z-index: 999;
        }
        .aviso.visible { transform: translateX(-50%) translateY(0); }
    </style>
</head>

        librero: '<svg viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="2" width="64" height="56" rx="3" fill="#7a4a2a"/><rect x="8" y="2" width="64" height="56" rx="3" fill="none" stroke="#5a3010" stroke-width="1.5"/><line x1="8" y1="14" x2="72" y2="14" stroke="#5a3010" stroke-width="1.5"/><line x1="8" y1="26" x2="72" y2="26" stroke="#5a3010" stroke-width="1.5"/><line x1="8" y1="38" x2="72" y2="38" stroke="#5a3010" stroke-width="1.5"/><line x1="8" y1="50" x2="72" y2="50" stroke="#5a3010" stroke-width="1.5"/><rect x="12" y="4" width="5" height="10" rx="1" fill="#c8820a"/><rect x="18" y="6" width="7" height="8" rx="1" fill="#8a4a2a"/><rect x="26" y="4" width="4" height="10" rx="1" fill="#2a5a3a"/><rect x="31" y="5" width="6" height="9" rx="1" fill="#c8820a" opacity="0.7"/><rect x="38" y="3" width="5" height="11" rx="1" fill="#5a3a8a"/><rect x="44" y="6" width="7" height="8" rx="1" fill="#8a4a2a" opacity="0.8"/><rect x="12" y="16" width="7" height="10" rx="1" fill="#2a5a3a"/><rect x="20" y="17" width="5" height="9" rx="1" fill="#c8820a"/><rect x="26" y="15" width="8" height="11" rx="1" fill="#8a4a2a"/><rect x="35" y="17" width="5" height="9" rx="1" fill="#5a3a8a" opacity="0.8"/></svg>',
        mcentro: '<svg viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="22" width="64" height="10" rx="3" fill="#7a4a2a"/><rect x="10" y="22" width="60" height="5" rx="2" fill="#9a6040" opacity="0.6"/><rect x="14" y="32" width="6" height="20" rx="3" fill="#5a3010"/><rect x="60" y="32" width="6" height="20" rx="3" fill="#5a3010"/><rect x="26" y="32" width="6" height="20" rx="3" fill="#5a3010"/><rect x="48" y="32" width="6" height="20" rx="3" fill="#5a3010"/><line x1="14" y1="50" x2="66" y2="50" stroke="#4a2010" stroke-width="2"/></svg>',
        vitrina: '<svg viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="2" width="68" height="56" rx="3" fill="#7a4a2a"/><rect x="6" y="2" width="68" height="56" rx="3" fill="none" stroke="#5a3010" stroke-width="1.5"/><line x1="40" y1="2" x2="40" y2="50" stroke="#5a3010" stroke-width="2"/><rect x="10" y="6" width="26" height="42" rx="2" fill="#a8c8d0" opacity="0.4"/><rect x="44" y="6" width="26" height="42" rx="2" fill="#a8c8d0" opacity="0.4"/><line x1="10" y1="26" x2="36" y2="26" stroke="#5a3010" stroke-width="1"/><line x1="44" y1="26" x2="70" y2="26" stroke="#5a3010" stroke-width="1"/><rect x="14" y="10" width="8" height="14" rx="1" fill="#c8a060" opacity="0.5"/><rect x="48" y="10" width="8" height="14" rx="1" fill="#c8a060" opacity="0.5"/><circle cx="37" cy="26" r="2" fill="#c8820a"/><circle cx="43" cy="26" r="2" fill="#c8820a"/><rect x="6" y="50" width="68" height="8" rx="3" fill="#5a3010"/></svg>'
    };

    var bgProductos = { 1:'#e8d5b8', 2:'#d4c4a8', 3:'#e0cdb0', 4:'#ddd0b8', 5:'#d8c8a4', 6:'#ddc9a8', 7:'#d0c0a0', 8:'#d4c4a0', 9:'#cdc0a8', 10:'#d8cab0' };

    /* Catálogo de productos */
    var productos = {
        recamara: [
            { id:1, nombre:"Cómoda Colonial",   precio:"$4,500", categoria:"Recámara", svg:"comoda",  desc:"Cómoda de 6 cajones en madera de pino. Acabado barniz natural con tiradores de hierro forjado." },
            { id:2, nombre:"Cama King",          precio:"$8,200", categoria:"Recámara", svg:"cama",    desc:"Cama king size con cabecera tallada a mano. Madera de mezquite macizo." },
            { id:3, nombre:"Buró Rústico",       precio:"$1,800", categoria:"Recámara", svg:"buro",    desc:"Buró de noche con 2 cajones y estante inferior. Madera de encino con acabado mate." },
            { id:4, nombre:"Tocador con Espejo", precio:"$5,600", categoria:"Recámara", svg:"tocador", desc:"Tocador con 3 cajones y espejo ovalado biselado. Madera de nogal con patas torneadas." }
        ],
        cocina: [
            { id:5, nombre:"Mesa Familiar",    precio:"$6,000", categoria:"Cocina", svg:"mesa",    desc:"Mesa rectangular para 6 personas. Madera de pino cepillado. Medidas: 180x90 cm." },
            { id:6, nombre:"Silla Campestre",  precio:"$1,200", categoria:"Cocina", svg:"silla",   desc:"Silla con respaldo de listones y asiento tapizado. Madera de roble con acabado nogal." },
            { id:7, nombre:"Alacena Colonial", precio:"$7,800", categoria:"Cocina", svg:"alacena", desc:"Alacena de 2 puertas con vitrina y 4 cajones inferiores. Madera de mezquite." }
        ],
        sala: [
            { id:8,  nombre:"Librero Rústico",    precio:"$3,200", categoria:"Sala", svg:"librero", desc:"Librero de 5 repisas en madera de pino. Acabado envejecido con cera natural." },
            { id:9,  nombre:"Mesa de Centro",     precio:"$2,400", categoria:"Sala", svg:"mcentro", desc:"Mesa de centro con base de tronco natural y cubierta de vidrio templado." },
            { id:10, nombre:"Vitrina Exhibidora", precio:"$5,100", categoria:"Sala", svg:"vitrina", desc:"Vitrina con puertas de vidrio y 4 repisas. Madera de caoba con herrajes dorados." }
        ]
    };

    var reseñas = {
        1:[{ usuario:"María G.",  estrellas:5, texto:"Excelente calidad, muy bonita." }],
        2:[{ usuario:"Carlos R.", estrellas:5, texto:"Madera muy resistente, quedó perfecta." }],
        3:[{ usuario:"Lupita749", estrellas:4, texto:"Tardó un poco pero valió la pena." }],
        4:[], 5:[], 6:[], 7:[], 8:[], 9:[], 10:[]
    };

    var estrellaSeleccionada = 0;
    var productoActual = null;

    /* Clonar el nav en las 3 pantallas al cargar la página */
    window.onload = function() {
        var template = document.getElementById("nav-template");
        ["nav-inicio", "nav-catalogo", "nav-detalle"].forEach(function(id) {
            document.getElementById(id).appendChild(template.content.cloneNode(true));
        });
    };

    function mostrarPantalla(id) {
        ["inicio", "catalogo", "detalle"].forEach(function(p) {
            document.getElementById(p).classList.remove("activa");
        });
        document.getElementById(id).classList.add("activa");
        window.scrollTo(0, 0);
    }

    function abrirCatalogo(filtro) {
        var cont = document.getElementById("contenido-catalogo");
        cont.innerHTML = "";
        var categorias = filtro === "todas" ? ["recamara", "cocina", "sala"] : [filtro];
        var nombres = { recamara:"Recámara", cocina:"Cocina", sala:"Sala" };

        categorias.forEach(function(clave) {
            if (filtro === "todas") {
                var t = document.createElement("div");
                t.className = "grupo-titulo";
                t.textContent = nombres[clave];
                cont.appendChild(t);
            }
            var grid = document.createElement("div");
            grid.className = "grid-productos";
            productos[clave].forEach(function(p) {
                var tarjeta = document.createElement("div");
                tarjeta.className = "tarjeta-producto";
                tarjeta.innerHTML =
                    '<div class="imagen-producto" style="background:' + bgProductos[p.id] + '">' + svgProductos[p.svg] + '</div>' +
                    '<div class="info"><div class="nombre">' + p.nombre + '</div><div class="precio">' + p.precio + '</div></div>';
                tarjeta.onclick = function() { abrirDetalle(p); };
                grid.appendChild(tarjeta);
            });
            cont.appendChild(grid);
        });

        mostrarPantalla("catalogo");
    }

    function abrirDetalle(producto) {
        productoActual = producto;
        estrellaSeleccionada = 0;
        document.getElementById("contenido-detalle").innerHTML =
            '<div class="detalle-header">' +
                '<div class="detalle-imagen" style="background:' + bgProductos[producto.id] + '">' + svgProductos[producto.svg] + '</div>' +
                '<div class="detalle-info">' +
                    '<h3>' + producto.nombre + '</h3>' +
                    '<div class="categoria">' + producto.categoria + '</div>' +
                    '<p>' + producto.desc + '</p>' +
                    '<button class="btn-comprar" onclick="mostrarAviso()">Comprar / Contactar</button>' +
                '</div>' +
            '</div>' +
            '<div class="reseñas-titulo">Reseñas</div>' +
            '<div id="lista-reseñas"></div>' +
            '<div class="form-reseña">' +
                '<h4>Deja tu reseña</h4>' +
                '<input type="text" id="input-nombre" placeholder="Tu nombre" maxlength="30">' +
                '<textarea id="input-comentario" rows="3" placeholder="Tu comentario..." maxlength="200"></textarea>' +
                '<div class="selector-estrellas">Calificación: ' +
                    '<span class="estrella" onclick="elegirEstrella(1)">&#9733;</span>' +
                    '<span class="estrella" onclick="elegirEstrella(2)">&#9733;</span>' +
                    '<span class="estrella" onclick="elegirEstrella(3)">&#9733;</span>' +
                    '<span class="estrella" onclick="elegirEstrella(4)">&#9733;</span>' +
                    '<span class="estrella" onclick="elegirEstrella(5)">&#9733;</span>' +
                '</div>' +
                '<button class="btn-publicar" onclick="publicarReseña()">Publicar reseña</button>' +
            '</div>';
        renderizarReseñas(producto.id);
        mostrarPantalla("detalle");
    }

    function renderizarReseñas(id) {
        var lista = document.getElementById("lista-reseñas");
        if (!reseñas[id].length) {
            lista.innerHTML = '<p style="font-size:13px;color:#999;margin-bottom:8px;">Sin reseñas aún. ¡Sé el primero!</p>';
            return;
        }
        lista.innerHTML = reseñas[id].map(function(r) {
            var estrellas = [1,2,3,4,5].map(function(s) {
                return '<span style="color:' + (s <= r.estrellas ? '#c8820a' : '#ddd') + '">&#9733;</span>';
            }).join("");
            return '<div class="tarjeta-reseña"><div class="avatar">👤</div><div>' +
                '<div class="usuario">' + r.usuario + '</div>' +
                '<div class="estrellas">' + estrellas + '</div>' +
                '<div class="texto">' + r.texto + '</div>' +
                '</div></div>';
        }).join("");
    }

    function elegirEstrella(numero) {
        estrellaSeleccionada = numero;
        document.querySelectorAll(".selector-estrellas .estrella").forEach(function(el, i) {
            el.classList.toggle("activa", i < numero);
        });
    }

    function publicarReseña() {
        var nombre     = document.getElementById("input-nombre").value.trim();
        var comentario = document.getElementById("input-comentario").value.trim();
        if (!nombre)              { alert("Escribe tu nombre.");          return; }
        if (!comentario)          { alert("Escribe un comentario.");      return; }
        if (!estrellaSeleccionada){ alert("Selecciona una calificación."); return; }
        reseñas[productoActual.id].unshift({ usuario:nombre, estrellas:estrellaSeleccionada, texto:comentario });
        document.getElementById("input-nombre").value = "";
        document.getElementById("input-comentario").value = "";
        elegirEstrella(0);
        renderizarReseñas(productoActual.id);
        mostrarAviso("¡Reseña publicada! 🙌");
    }

    function mostrarAviso(mensaje) {
        var aviso = document.getElementById("aviso");
        aviso.textContent = mensaje || "📞 ¡Nos pondremos en contacto contigo!";
        aviso.classList.add("visible");
        setTimeout(function() { aviso.classList.remove("visible"); }, 3000);
    }

</script>

</html>
